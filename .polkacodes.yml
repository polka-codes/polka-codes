scripts:
  format:
    command: bun run fix
    description: Format code and fix lint issues
  check:
    command: bun run check
    description: Typecheck and lint
  test:
    command: bun test
    description: Run tests
  build:
    command: bun run build
    description: Build packages
excludeFiles:
  - .env
  - .env.*
  - "*.pem"
  - "*.key"
  - .npmrc
