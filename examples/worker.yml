# Execute a plan and archive it only when every task is verified complete.
# Usage: polka workflow -f examples/worker.yml plans/active/feature.md
workflows:
  main:
    task: Execute tasks from a plan file
    inputs:
      - id: planFile
        description: Path to the plan Markdown file
      - id: autoCommit
        default: true
    steps:
      - id: read-plan
        task: Read input.planFile. Return whether unfinished tasks remain, plus the plan details including task status, dependencies, and acceptance criteria.
        tools: [readFile]
        output: plan
        outputSchema: &plan
          type: object
          properties:
            hasIncompleteTasks: {type: boolean}
            details: {type: string}
          required: [hasIncompleteTasks, details]
      - id: validate
        task: Validate state.plan for parseable task checkboxes, acceptance criteria, and acyclic dependencies. Return valid and a reason.
        tools: []
        output: validation
        outputSchema:
          type: object
          properties:
            valid: {type: boolean}
            reason: {type: string}
          required: [valid, reason]
      - id: execution-loop
        while:
          condition: state.validation.valid && state.plan.hasIncompleteTasks
          steps:
            - id: find-next-task
              task: Select the highest-priority unfinished task in state.plan whose prerequisites are complete. Return found false if all remaining tasks are blocked; otherwise describe the selected task and its acceptance criteria.
              tools: []
              output: nextTask
              outputSchema:
                type: object
                properties:
                  found: {type: boolean}
                  description: {type: string}
                required: [found, description]
            - id: stop-if-blocked
              if:
                condition: state.nextTask.found === false
                thenBranch:
                  - break: true
            - id: execute-task
              task: Implement state.nextTask.description. Inspect relevant files, apply focused changes, and run its verification steps.
              tools: [executeCommand, readFile, writeToFile, replaceInFile, searchFiles]
              output: result
            - id: verify-task
              task: Independently check whether state.nextTask meets its acceptance criteria. Run the relevant checks and return passed with evidence or failure reasons.
              tools: [executeCommand, readFile]
              output: verification
              outputSchema:
                type: object
                properties:
                  passed: {type: boolean}
                  details: {type: string}
                required: [passed, details]
            - id: handle-verification
              if:
                condition: state.verification.passed
                thenBranch:
                  - id: mark-completed
                    task: Mark state.nextTask complete in input.planFile. Re-read the updated plan and return its current hasIncompleteTasks and details.
                    tools: [readFile, writeToFile]
                    output: plan
                    outputSchema: *plan
                  - id: commit-work
                    if:
                      condition: input.autoCommit === true
                      thenBranch:
                        - id: do-commit
                          task: Commit only the changes for the completed task and its plan update. Preserve unrelated work and report the commit.
                          tools: [executeCommand]
                elseBranch:
                  - id: record-failure
                    task: Record state.verification.details in input.planFile, keeping the task unfinished. Do not archive the plan.
                    tools: [readFile, writeToFile]
                  - break: true
      - id: finish-plan
        if:
          condition: state.validation.valid && state.plan.hasIncompleteTasks === false
          thenBranch:
            - id: archive-plan
              task: Ensure plans/completed exists using executeCommand, then move input.planFile there using renameFile. Preserve any existing destination file and report a conflict instead of overwriting it. Report the saved path.
              tools: [executeCommand, renameFile]
          elseBranch:
            - id: report-incomplete
              task: Report why the plan remains unfinished or invalid using state.validation, state.nextTask, and state.verification when present. Keep the plan in its current location.
              tools: []
      - id: summary
        task: Summarize verified completions, remaining tasks, any failure or blocker, and whether the plan was archived.
        tools: []
