# Review local changes and commit when no critical or major issues remain.
# Usage: polka workflow -f examples/review-and-commit.yml
# Edit the defaults to change the number of cycles, commit policy, or delay.
workflows:
  main:
    task: Review changes and create validated commits
    inputs:
      - id: maxIterations
        default: 1
      - id: commitOnSuccess
        default: true
      - id: sleepInterval
        default: 30000
      - id: reviewContext
        default: ""
    steps:
      - id: init
        task: Return count equal to zero.
        tools: []
        output: iteration
        outputSchema: &iteration
          type: object
          properties:
            count: {type: integer}
          required: [count]
      - id: review-commit-loop
        while:
          condition: state.iteration.count < input.maxIterations
          steps:
            - id: increment
              task: Return count equal to state.iteration.count plus one.
              tools: []
              output: iteration
              outputSchema: *iteration
            - id: check-changes
              task: Check git status for staged, unstaged, and untracked changes. Return whether there are changes to review.
              tools: [executeCommand]
              output: gitStatus
              outputSchema:
                type: object
                properties:
                  hasChanges: {type: boolean}
                required: [hasChanges]
            - id: no-changes-exit
              if:
                condition: state.gitStatus.hasChanges === false
                thenBranch:
                  - break: true
            - id: review-changes
              task: Review the current changes using input.reviewContext. Identify concrete correctness issues with file references and indicate whether any are critical or major.
              tools: [executeCommand, readFile, listFiles, searchFiles]
              output: review
              outputSchema:
                type: object
                properties:
                  hasCriticalOrMajorIssues: {type: boolean}
                  details: {type: string}
                required: [hasCriticalOrMajorIssues, details]
            - id: commit-or-stop
              if:
                condition: state.review.hasCriticalOrMajorIssues === false && input.commitOnSuccess === true
                thenBranch:
                  - id: create-commit
                    task: Commit only the reviewed changes with a concise message explaining what changed and why. Preserve unrelated changes. Report the resulting commit.
                    tools: [executeCommand]
                elseBranch:
                  - id: report-review
                    task: Report state.review.details and explain whether issues remain or input.commitOnSuccess disables committing.
                    tools: []
                  - break: true
            - id: wait-if-needed
              if:
                condition: state.iteration.count < input.maxIterations && input.sleepInterval > 0
                thenBranch:
                  - id: sleep
                    task: Use executeCommand to sleep for input.sleepInterval milliseconds, converting to seconds as needed.
                    tools: [executeCommand]
      - id: summary
        task: Summarize the reviews, any commits actually created, and outstanding findings.
        tools: []
