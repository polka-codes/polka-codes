# Two explicit workflows: one improvement pass, or execution of a plan.
# Usage: polka workflow -f examples/agent-like-workflow.yml -w improve
# Usage: polka workflow -f examples/agent-like-workflow.yml -w execute-plan plans/active/feature.md
# For repeated timed passes, use continuous-improvement.yml; there is no --continuous flag.
workflows:
  improve:
    task: Discover and fix one repository issue
    inputs:
      - id: focus
        default: all
    steps:
      - id: discover
        task: Run checks for input.focus. Return the current issue count and descriptions.
        tools: [executeCommand, readFile]
        output: issues
        outputSchema:
          type: object
          properties:
            count: {type: integer}
            descriptions: {type: array, items: {type: string}}
          required: [count, descriptions]
      - id: improve-if-needed
        if:
          condition: state.issues.count > 0
          thenBranch:
            - id: fix
              task: Fix the highest-priority issue in state.issues.descriptions and verify it with the relevant checks.
              tools: [executeCommand, readFile, writeToFile, replaceInFile, searchFiles]
          elseBranch:
            - id: no-issues
              task: Report that the current checks found no issues.
              tools: []
      - id: summary
        task: Report the observed checks and changes from this pass, including any remaining issues.
        tools: []
  execute-plan:
    task: Execute the ready tasks from a plan
    inputs:
      - id: planFile
        default: plans/active/feature.md
    steps:
      - id: read-plan
        task: Read input.planFile. Return descriptions of all unfinished tasks in dependency order; retain blocked tasks so they cannot be mistaken for completed work.
        tools: [readFile]
        output: remaining
        outputSchema: &tasks
          type: array
          items: {type: string}
      - id: execute-tasks
        while:
          condition: state.remaining.length > 0
          steps:
            - id: execute-task
              task: Inspect state.remaining and input.planFile. Implement the first ready task, verify it, and mark it complete in the plan only if checks pass. Return completed false if it fails or no task is ready.
              tools: [executeCommand, readFile, writeToFile, replaceInFile, searchFiles]
              output: result
              outputSchema:
                type: object
                properties:
                  completed: {type: boolean}
                  details: {type: string}
                required: [completed, details]
            - id: stop-if-incomplete
              if:
                condition: state.result.completed === false
                thenBranch:
                  - break: true
            - id: refresh-plan
              task: Re-read input.planFile and return descriptions of all unfinished tasks in dependency order.
              tools: [readFile]
              output: remaining
              outputSchema: *tasks
      - id: summary
        task: Report verified completions and remaining tasks from state.remaining. If execution stopped early, include state.result.details. Do not claim completion while tasks remain.
        tools: []
