# Create a plan file for the worker example.
# Usage: polka workflow -f examples/planner.yml "Add user authentication"
# A positional argument supplies the first input directly; do not prefix it with goal:.
workflows:
  main:
    task: Create an implementation plan from a goal
    inputs:
      - id: goal
        description: High-level feature or goal to implement
      - id: planName
        default: feature
      - id: priority
        default: High
    steps:
      - id: analyze-goal
        task: Inspect the repository for input.goal. Identify requirements, existing patterns, dependencies, and acceptance criteria.
        tools: [listFiles, searchFiles, readFile]
        output: analysis
      - id: create-plan
        task: Use input.goal, input.priority, and state.analysis to produce a Markdown plan. Include ordered task checkboxes, descriptions, dependencies, and acceptance criteria. Return the Markdown text.
        tools: []
        output: markdown
        outputSchema: {type: string}
      - id: write-plan
        task: Use writeToFile to save state.markdown under plans/active/ with input.planName as the filename and .md as its extension. Return the saved path.
        tools: [writeToFile]
        output: planPath
        outputSchema: {type: string}
      - id: summary
        task: Report state.planPath. Explain that it can be reviewed and then passed as the positional argument to polka workflow -f examples/worker.yml.
        tools: []
