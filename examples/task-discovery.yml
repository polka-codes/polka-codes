# Discover and fix issues until a fresh scan reports none.
# Usage: polka workflow -f examples/task-discovery.yml
# Optional positional input selects the focus: polka workflow -f examples/task-discovery.yml lint
# Tasks receive input and state as JSON; task text is not a template.
workflows:
  main:
    task: Discover and resolve repository issues
    inputs:
      - id: focus
        default: all
    steps:
      - id: discover
        task: Run checks for input.focus (all, tests, lint, or type-check). Return the actual remaining issues and their count.
        tools: [executeCommand]
        output: issues
        outputSchema: &issues
          type: object
          properties:
            count: {type: integer}
            descriptions: {type: array, items: {type: string}}
          required: [count, descriptions]
      - id: fix-loop
        while:
          condition: state.issues.count > 0
          steps:
            - id: fix
              task: Fix the highest-priority issue in state.issues.descriptions. Inspect relevant files and verify the change.
              tools: [executeCommand, readFile, writeToFile, replaceInFile, searchFiles]
            - id: rediscover
              task: Re-run the checks for input.focus. Return the observed remaining issues and count; do not estimate by decrementing.
              tools: [executeCommand]
              output: issues
              outputSchema: *issues
      - id: summary
        task: Summarize the changes and final check results in state.issues.
        tools: []
