# Repeat build/test checks and repairs for a bounded number of cycles.
# Usage: polka workflow -f examples/continuous-improvement.yml
# Edit the defaults below to change the cycle count or delay.
# The runtime also enforces its 1000-iteration limit; this is not a background service.
workflows:
  main:
    task: Improve codebase quality across repeated checks
    inputs:
      - id: maxIterations
        default: 3
      - id: sleepInterval
        description: Delay between cycles in milliseconds
        default: 5000
    steps:
      - id: init
        task: Return count equal to zero.
        tools: []
        output: iteration
        outputSchema: &iteration
          type: object
          properties:
            count: {type: integer}
          required: [count]
      - id: improvement-loop
        while:
          condition: state.iteration.count < input.maxIterations
          steps:
            - id: increment
              task: Return count equal to state.iteration.count plus one.
              tools: []
              output: iteration
              outputSchema: *iteration
            - id: check-build
              task: Run bun run build and report whether it failed, including the output.
              tools: [executeCommand]
              output: buildResult
              outputSchema: &check
                type: object
                properties:
                  failed: {type: boolean}
                  details: {type: string}
                required: [failed, details]
            - id: check-tests
              task: Run bun test and report whether it failed, including the output.
              tools: [executeCommand]
              output: testResult
              outputSchema: *check
            - id: fix-if-needed
              if:
                condition: state.buildResult.failed || state.testResult.failed
                thenBranch:
                  - id: fix-issues
                    task: Resolve the failures in state.buildResult and state.testResult, then re-run the checks to verify.
                    tools: [executeCommand, readFile, writeToFile, replaceInFile, searchFiles]
                elseBranch:
                  - id: no-issues
                    task: Report that the checks passed in this cycle.
                    tools: []
            - id: wait-if-needed
              if:
                condition: state.iteration.count < input.maxIterations && input.sleepInterval > 0
                thenBranch:
                  - id: sleep
                    task: Use executeCommand to run a sleep command for input.sleepInterval milliseconds, converting to seconds as needed.
                    tools: [executeCommand]
      - id: summary
        task: Summarize the completed cycles, checks, changes, and any unresolved failures without claiming unverified success.
        tools: []
